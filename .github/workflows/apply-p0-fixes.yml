name: apply remaining p0 fixes

on:
  push:
    branches: [fix/sigaction-restore]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/thread-safe-init
          path: thread
      - uses: actions/checkout@v6
        with:
          ref: fix/probe-signal-chaining
          path: chain
      - uses: actions/checkout@v6
        with:
          ref: fix/sigaction-restore
          path: source
      - name: Apply thread-local probe state fix
        working-directory: thread
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ruapu.h')
          s = p.read_text()
          old = '''static volatile sig_atomic_t g_ruapu_sig_caught = 0;\nstatic sigjmp_buf g_ruapu_jmpbuf;\n'''
          new = '''static __thread volatile sig_atomic_t g_ruapu_sig_caught = 0;\nstatic __thread sigjmp_buf g_ruapu_jmpbuf;\n'''
          if old not in s:
              raise SystemExit('thread-local target block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          gcc main.c -o /tmp/ruapu-thread
          /tmp/ruapu-thread >/dev/null 2>&1
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add ruapu.h
          git commit -m 'unix: make probe state thread-local'
          git push origin HEAD:fix/thread-safe-init
      - name: Apply signal chaining fix
        working-directory: chain
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ruapu.h')
          s = p.read_text()
          old = '''static volatile sig_atomic_t g_ruapu_sig_caught = 0;\nstatic sigjmp_buf g_ruapu_jmpbuf;\n\nstatic void ruapu_catch_sig(int signo, siginfo_t* si, void* data)\n{\n    (void)signo;\n    (void)si;\n    (void)data;\n\n    g_ruapu_sig_caught = 1;\n    siglongjmp(g_ruapu_jmpbuf, -1);\n}\n'''
          new = '''static volatile sig_atomic_t g_ruapu_sig_caught = 0;\nstatic sigjmp_buf g_ruapu_jmpbuf;\nstatic __thread volatile sig_atomic_t g_ruapu_probe_active = 0;\nstatic struct sigaction g_ruapu_old_sigill_sa;\nstatic struct sigaction g_ruapu_old_sigsegv_sa;\n\nstatic void ruapu_chain_sig(int signo, siginfo_t* si, void* data)\n{\n    struct sigaction* old_sa = signo == SIGILL ? &g_ruapu_old_sigill_sa : &g_ruapu_old_sigsegv_sa;\n\n    if (old_sa->sa_handler == SIG_IGN)\n        return;\n\n    if (old_sa->sa_handler == SIG_DFL)\n    {\n        sigaction(signo, old_sa, NULL);\n        raise(signo);\n        return;\n    }\n\n    if (old_sa->sa_flags & SA_SIGINFO)\n        old_sa->sa_sigaction(signo, si, data);\n    else\n        old_sa->sa_handler(signo);\n}\n\nstatic void ruapu_catch_sig(int signo, siginfo_t* si, void* data)\n{\n    if (!g_ruapu_probe_active)\n    {\n        ruapu_chain_sig(signo, si, data);\n        return;\n    }\n\n    g_ruapu_sig_caught = 1;\n    g_ruapu_probe_active = 0;\n    siglongjmp(g_ruapu_jmpbuf, -1);\n}\n'''
          if old not in s:
              raise SystemExit('signal handler target block not found')
          s = s.replace(old, new, 1)
          old = '''    sigaction(SIGILL, &sa, &old_sa);\n    sigaction(SIGSEGV, &sa, &old_sa);\n\n    if (sigsetjmp(g_ruapu_jmpbuf, 1) == 0)\n    {\n        some_inst();\n    }\n'''
          new = '''    sigaction(SIGILL, &sa, &old_sa);\n    g_ruapu_old_sigill_sa = old_sa;\n    sigaction(SIGSEGV, &sa, &old_sa);\n    g_ruapu_old_sigsegv_sa = old_sa;\n\n    if (sigsetjmp(g_ruapu_jmpbuf, 1) == 0)\n    {\n        g_ruapu_probe_active = 1;\n        some_inst();\n        g_ruapu_probe_active = 0;\n    }\n'''
          if old not in s:
              raise SystemExit('probe target block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          gcc main.c -o /tmp/ruapu-chain
          /tmp/ruapu-chain >/dev/null 2>&1
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add ruapu.h
          git commit -m 'unix: chain signals outside active probes'
          git push origin HEAD:fix/probe-signal-chaining
      - name: Remove temporary workflow
        working-directory: source
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git rm .github/workflows/apply-p0-fixes.yml
          git commit -m 'ci: remove temporary p0 fix workflow'
          git push origin HEAD:fix/sigaction-restore
