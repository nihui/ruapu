name: apply-amx-fix
on: [push]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        ref: fix/amx-os-enable
    - shell: bash
      run: |
        python3 - <<'PY'
        from pathlib import Path
        p = Path('ruapu.h')
        s = p.read_text()
        anchor = 'typedef void (*ruapu_some_inst)();\n'
        add = '''\n#if defined _WIN32 && (defined(__x86_64__) || defined(_M_X64))\n#include <windows.h>\n#endif\n\nstatic void ruapu_prepare_isa()\n{\n#if defined __linux__ && defined __x86_64__ && !defined __ILP32__\n    long ret;\n    asm volatile("syscall"\n                 : "=a"(ret)\n                 : "0"(158L), "D"(0x1023L), "S"(18L)\n                 : "rcx", "r11", "memory");\n    (void)ret;\n#elif defined _WIN32 && (defined(__x86_64__) || defined(_M_X64))\n    typedef BOOL (WINAPI *ruapu_enable_process_optional_xstate_features)(DWORD64);\n\n    HMODULE kernel32 = GetModuleHandleA("kernel32.dll");\n    if (!kernel32)\n        return;\n\n    ruapu_enable_process_optional_xstate_features enable_process_optional_xstate_features =\n        (ruapu_enable_process_optional_xstate_features)GetProcAddress(kernel32, "EnableProcessOptionalXStateFeatures");\n    if (enable_process_optional_xstate_features)\n        enable_process_optional_xstate_features((1ull << 17) | (1ull << 18));\n#endif\n}\n'''
        if anchor not in s:
            raise SystemExit('typedef anchor not found')
        s = s.replace(anchor, anchor + add, 1)
        old = '''RUAPU_INSTCODE(amxfp16, 0xc4, 0xe2, 0x7b, 0x5c, 0xd1) // tdpfp16ps %tmm0, %tmm1, %tmm2\nRUAPU_INSTCODE(amxbf16, 0xc4, 0xe2, 0x7a, 0x5c, 0xd1) // tdpbf16ps %tmm0, %tmm1, %tmm2\nRUAPU_INSTCODE(amxint8, 0xc4, 0xe2, 0x7b, 0x5e, 0xd1) // tdpbssd %tmm0, %tmm1, %tmm2\nRUAPU_INSTCODE(amxtile, 0xc4, 0xe2, 0x7a, 0x49, 0xc0) // tilezero %tmm0\n'''
        cfg = [0] * 64
        cfg[0] = 1
        for i in range(3):
            cfg[16 + i * 2] = 64
            cfg[48 + i] = 16
        cfgstr = ', '.join('0x%02x' % x for x in cfg)
        prefix = '0xc4, 0xe2, 0x78, 0x49, 0x05, 0x0c, 0x00, 0x00, 0x00'
        suffix = '0xc4, 0xe2, 0x78, 0x49, 0xc0, 0xeb, 0x40'
        new = f'''RUAPU_INSTCODE(amxfp16, {prefix}, 0xc4, 0xe2, 0x7b, 0x5c, 0xd1, {suffix}, {cfgstr}) // ldtilecfg + tdpfp16ps + tilerelease\nRUAPU_INSTCODE(amxbf16, {prefix}, 0xc4, 0xe2, 0x7a, 0x5c, 0xd1, {suffix}, {cfgstr}) // ldtilecfg + tdpbf16ps + tilerelease\nRUAPU_INSTCODE(amxint8, {prefix}, 0xc4, 0xe2, 0x7b, 0x5e, 0xd1, {suffix}, {cfgstr}) // ldtilecfg + tdpbssd + tilerelease\nRUAPU_INSTCODE(amxtile, 0xc4, 0xe2, 0x78, 0x49, 0xc0) // tilerelease\n'''
        if old not in s:
            raise SystemExit('AMX opcode block not found')
        s = s.replace(old, new, 1)
        old_init = 'void ruapu_init()\n{\n#if defined _WIN32 || defined __ANDROID__ || defined __linux__ || defined __APPLE__ || defined __FreeBSD__ || defined __NetBSD__ || defined __OpenBSD__ || defined __DragonFly__ || defined __sun__ || defined __SYTERKIT__\n'
        new_init = 'void ruapu_init()\n{\n    ruapu_prepare_isa();\n\n#if defined _WIN32 || defined __ANDROID__ || defined __linux__ || defined __APPLE__ || defined __FreeBSD__ || defined __NetBSD__ || defined __OpenBSD__ || defined __DragonFly__ || defined __sun__ || defined __SYTERKIT__\n'
        if old_init not in s:
            raise SystemExit('ruapu_init anchor not found')
        s = s.replace(old_init, new_init, 1)
        p.write_text(s)
        PY
        gcc main.c -o /tmp/ruapu
        /tmp/ruapu >/dev/null 2>&1
        git config user.name github-actions
        git config user.email github-actions@github.com
        git add ruapu.h
        git rm .github/workflows/apply-amx-os-enable.yml
        git commit -m 'x86: enable and configure AMX before probing'
        git push origin HEAD:fix/amx-os-enable
