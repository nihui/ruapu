name: update-amx-syscall-wrapper
on:
  push:
    branches: ["fix/amx-os-enable"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/amx-os-enable
      - run: |
          sed -i '/    long ret;/,/    (void)ret;/c\    extern long syscall(long, ...);\n\n    // arch_prctl(ARCH_REQ_XCOMP_PERM, XFEATURE_XTILEDATA)\n    syscall(158, 0x1023, 18);' ruapu.h
          gcc main.c -o /tmp/ruapu
          /tmp/ruapu >/dev/null 2>&1
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add ruapu.h
          git rm .github/workflows/update-amx-syscall-wrapper.yml
          git commit -m 'x86: avoid inline asm for AMX permission request'
          git push origin HEAD:fix/amx-os-enable
