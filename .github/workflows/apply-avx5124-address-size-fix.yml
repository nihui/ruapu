name: apply AVX5124 address-size fix

on:
  push:
    branches: [fix/avx5124-address-size]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/avx5124-address-size
      - name: Apply fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('ruapu.h')
          s = p.read_text()
          old1 = 'RUAPU_INSTCODE(avx5124fmaps, 0x67, 0x62, 0xf2, 0x7f, 0x48, 0x9a, 0x04, 0x24) //v4fmaddps zmm0,zmm0,XMMWORD PTR [esp]'
          new1 = 'RUAPU_INSTCODE(avx5124fmaps, 0x62, 0xf2, 0x7f, 0x48, 0x9a, 0x04, 0x24) //v4fmaddps zmm0,zmm0,XMMWORD PTR [rsp/esp]'
          old2 = 'RUAPU_INSTCODE(avx5124vnniw, 0x67, 0x62, 0xf2, 0x7f, 0x48, 0x52, 0x04, 0x24) //vp4dpwssd zmm0,zmm0,XMMWORD PTR [esp]'
          new2 = 'RUAPU_INSTCODE(avx5124vnniw, 0x62, 0xf2, 0x7f, 0x48, 0x52, 0x04, 0x24) //vp4dpwssd zmm0,zmm0,XMMWORD PTR [rsp/esp]'
          if old1 not in s or old2 not in s:
              raise SystemExit('target opcode lines not found')
          s = s.replace(old1, new1, 1).replace(old2, new2, 1)
          p.write_text(s)
          PY
          gcc main.c -o /tmp/ruapu
          objdump -d -Mintel /tmp/ruapu | grep -A3 '<ruapu_some_avx5124fmaps>' || true
          objdump -d -Mintel /tmp/ruapu | grep -A3 '<ruapu_some_avx5124vnniw>' || true
          /tmp/ruapu >/dev/null 2>&1
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add ruapu.h
          git rm .github/workflows/apply-avx5124-address-size-fix.yml
          git commit -m 'x86: fix AVX5124 stack address encoding'
          git push origin HEAD:fix/avx5124-address-size
